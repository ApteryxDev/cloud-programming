# =============================================================================
# template.yaml
#
# AWS CloudFormation template for a globally-available static website.
#
# What this deploys:
#   - An S3 bucket that holds the site files (index.html, etc.)
#   - A CloudFront distribution in front of the bucket, with HTTPS, caching
#     and a global edge network for low latency
#   - An Origin Access Control (OAC) so that the bucket is *only* readable
#     through CloudFront, never directly from the public internet
#   - A bucket policy that grants CloudFront the permission to read objects
#   - CloudWatch alarms on the CloudFront 4xx and 5xx error rates so we
#     notice if the site starts misbehaving
#
# Why this design:
#   - S3 stores each object across multiple availability zones, so there is
#     no single machine that can take the site offline.
#   - CloudFront copies cached content to roughly 400 edge locations
#     worldwide, so visitors are served from a nearby cache and do not
#     pay the latency cost of reaching the origin region.
#   - There is no compute tier (no EC2, no ASG). Static content scales at
#     the platform level: S3 and CloudFront absorb traffic spikes on their
#     own. If a dynamic backend is added later, it would go behind a
#     CloudFront behaviour like /api/* on top of this same distribution.
#   - OAC is the current AWS-recommended way to lock the origin bucket
#     down. It replaces the older Origin Access Identity pattern.
#
# How to deploy:
#   aws cloudformation deploy \
#       --template-file template.yaml \
#       --stack-name aws-static-site \
#       --parameter-overrides BucketName=my-static-site-1234
#
# After the stack is created, upload an index.html to the bucket:
#   aws s3 cp index.html s3://<BucketName>/index.html
#
# References:
#   - CloudFront distributions:
#     https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudfront-distribution.html
#   - S3 buckets:
#     https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-s3-bucket.html
#   - Origin Access Control:
#     https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html
#   - CloudWatch alarms:
#     https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-cw-alarm.html
# =============================================================================

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Static website hosted on S3 and served globally through CloudFront,
  with an Origin Access Control so the bucket is private and CloudWatch
  alarms on 4xx/5xx error rates.

# -----------------------------------------------------------------------------
# Parameters — the few things a user is likely to change between deployments
# -----------------------------------------------------------------------------
Parameters:

  BucketName:
    Type: String
    Description: Globally unique name for the S3 bucket that stores the site.
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: >
      Must be 3-63 chars, lowercase letters, digits, dots and hyphens.

  DefaultRootObject:
    Type: String
    Default: index.html
    Description: File CloudFront returns for requests to the root URL.

  ErrorRateThreshold:
    Type: Number
    Default: 5
    Description: CloudWatch alarm threshold for 5xx error rate (percent).


# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------
Resources:

  # ---------------------------------------------------------------------------
  # S3 bucket: holds the site files (index.html, css, images, etc.).
  # Public access is blocked because the only thing allowed to read from
  # this bucket is CloudFront, via the OAC defined below.
  # ---------------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # ---------------------------------------------------------------------------
  # Origin Access Control (OAC): the modern AWS-recommended way to let
  # CloudFront read from a private S3 bucket. It signs requests so that
  # only this CloudFront distribution can fetch objects from the bucket.
  # ---------------------------------------------------------------------------
  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: OAC for the static-site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------------------------------------------------------------------------
  # CloudFront distribution: the global front door. It caches content at
  # ~400 edge locations worldwide, terminates HTTPS, and forwards requests
  # to the S3 origin when there is a cache miss.
  # ---------------------------------------------------------------------------
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Static site for ${AWS::StackName}"
        DefaultRootObject: !Ref DefaultRootObject
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100   # US + Europe edges; cheapest tier
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""     # left empty; OAC replaces it
            OriginAccessControlId: !GetAtt SiteOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https   # HTTPS everywhere
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS-managed "CachingOptimized" cache policy. Good default for
          # static content; we are not inventing our own cache rules yet.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # Friendly handling for client navigation: SPAs and direct deep
        # links return index.html for missing files instead of an XML error.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 60
        ViewerCertificate:
          CloudFrontDefaultCertificate: true        # *.cloudfront.net cert
          MinimumProtocolVersion: TLSv1.2_2021

  # ---------------------------------------------------------------------------
  # Bucket policy: grants the CloudFront distribution (via the OAC) the
  # right to read objects from the bucket. Without this policy, CloudFront
  # would still be blocked even though the OAC exists.
  # ---------------------------------------------------------------------------
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipalRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SiteBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub >-
                  arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  # ---------------------------------------------------------------------------
  # CloudWatch alarm on the 5xx error rate. If too many requests start
  # failing server-side, the alarm fires so we can investigate.
  # ---------------------------------------------------------------------------
  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-5xx-error-rate"
      AlarmDescription: >
        Fires when CloudFront's 5xx error rate exceeds the threshold over
        a 5-minute window.
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref SiteDistribution
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ErrorRateThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching


# -----------------------------------------------------------------------------
# Outputs — handy values you'd want after the stack is created
# -----------------------------------------------------------------------------
Outputs:

  SiteBucketName:
    Description: Upload site files to this bucket.
    Value: !Ref SiteBucket

  DistributionId:
    Description: CloudFront distribution ID (for cache invalidations).
    Value: !Ref SiteDistribution

  SiteURL:
    Description: Public URL of the site.
    Value: !Sub "https://${SiteDistribution.DomainName}"
