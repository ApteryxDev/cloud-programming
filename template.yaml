# CloudFormation for the Phase 2 portfolio (DLBSEPCP01_E).
# Deploys S3 + CloudFront for a static site, with an alarm on 5xx errors.
#
# deploy:
#   aws cloudformation deploy --template-file template.yaml \
#       --stack-name cloud-programming-site \
#       --parameter-overrides BucketName=<unique-name>
#
# then upload the page:
#   aws s3 cp index.html s3://<unique-name>/index.html

AWSTemplateFormatVersion: "2010-09-09"
Description: Static site on S3 + CloudFront for the Cloud Programming portfolio.

Parameters:

  BucketName:
    Type: String
    Description: bucket name (has to be globally unique)
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"

  DefaultRootObject:
    Type: String
    Default: index.html

  ErrorRateThreshold:
    Type: Number
    Default: 5
    Description: alarm fires when 5xx rate goes above this (percent)


Resources:

  # the bucket where index.html lives
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # no public access - cloudfront reads it through the OAC below
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # OAC = origin access control. lets cloudfront read from the private bucket.
  # this replaces the older "origin access identity" thing in AWS docs.
  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: OAC for the static-site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Static site for ${AWS::StackName}"
        DefaultRootObject: !Ref DefaultRootObject
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100  # cheapest tier (US + Europe edges only)
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""  # has to be empty string when using OAC
            OriginAccessControlId: !GetAtt SiteOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # this UUID is the managed "CachingOptimized" policy from AWS docs
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # if the bucket returns 403/404 just serve index.html anyway
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 60
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021

  # without this policy the OAC alone is not enough, cloudfront still gets 403
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipalRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SiteBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub >-
                  arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  # simple alarm - mostly here so monitoring is not completely empty
  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-5xx-error-rate"
      AlarmDescription: fires if 5xx error rate goes above threshold for 5 min
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref SiteDistribution
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ErrorRateThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching


Outputs:

  SiteBucketName:
    Description: upload site files here
    Value: !Ref SiteBucket

  DistributionId:
    Description: cloudfront distribution id
    Value: !Ref SiteDistribution

  SiteURL:
    Description: public URL of the site
    Value: !Sub "https://${SiteDistribution.DomainName}"